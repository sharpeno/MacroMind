<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23192a36%27/%3E%3Ctext x=%276%27 y=%2724%27 font-size=%2723%27 fill=%27white%27%3EM%3C/text%3E%3C/svg%3E"><title>MacroMind · 时政研究工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/market.js"></script><script defer src="/app.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/">MacroMind<span>时政研究工作台</span></a><nav id="nav" aria-label="主导航"></nav><button id="db-info" class="db-link">本地知识库 <span>↗</span></button><div class="sidebar-foot">以事实为起点<br>让分析有迹可循</div></aside>
<div class="shell"><header class="topbar"><h1 id="page-title">对话研究</h1><div class="connection"><i></i> 本地连接正常</div><button id="save-topic" class="quiet">保存话题</button></header>
<div class="workspace"><main><div class="context"><label>话题<select id="topic-select"><option value="">全部资料</option></select></label><label class="search-filter">筛选<input id="filter" placeholder="标题、正文关键词" autocomplete="off"></label><button id="clear-context" class="text-button">重置</button></div><div id="content" aria-live="polite"><p class="empty">正在连接本地知识库…</p></div></main><aside id="inspector" class="inspector" aria-label="证据与资料"></aside></div>
<footer><span id="status">正在读取本地资料</span><span>MacroMind · Local demo</span></footer></div>
<dialog id="topic-dialog"><form id="topic-form"><h2>保存为话题档案</h2><p class="muted">保留当前资料范围与对话，便于继续研究。</p><label>话题名称<input id="topic-name" maxlength="100" required placeholder="例如：通胀与货币政策"></label><div class="dialog-actions"><button type="button" id="cancel-topic">取消</button><button class="primary" type="submit">保存档案</button></div></form></dialog>
<div id="toast" role="status"></div>
</body></html>
