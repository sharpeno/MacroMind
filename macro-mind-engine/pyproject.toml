[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-mind-engine"
version = "0.1.0"
description = "MacroMind frozen contract, executable schemas and registries"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.22,<5", "ruff>=0.6"]

[project.scripts]
macromind = "macromind.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
exclude = ["**/_enums.py"]

